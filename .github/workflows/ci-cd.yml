name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: |
          ruff check .


  test:
    name: Run Tests
    runs-on: ubuntu-latest

    needs: quality

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          pytest


  docker:
    name: Build, Scan and Test Docker Image
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t production-cicd-devops:latest .

      - name: Security Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: production-cicd-devops:latest
          format: table
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library

      - name: Run Docker Container
        run: |
          docker run -d --name production-cicd-container -p 5000:5000 production-cicd-devops:latest

      - name: Wait for Application
        run: |
          sleep 5

      - name: Health Check
        run: |
          curl --fail http://localhost:5000/health

      - name: Stop Docker Container
        if: always()
        run: |
          docker stop production-cicd-container || true
          docker rm production-cicd-container || true


  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    needs: docker

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"

      - name: Terraform Format Check
        working-directory: terraform
        run: |
          terraform fmt -check

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate
